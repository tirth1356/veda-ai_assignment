services:
  - type: web
    name: veda-ai-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: veda-ai-redis
          property: connectionString

  - type: redis
    name: veda-ai-redis
    ipAllowList: [] # Allows internal connections within Render
    maxmemoryPolicy: noeviction
